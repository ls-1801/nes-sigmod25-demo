# ALSA configuration of the worker container. The container only sees the sound cards of the host that are passed
# through as /dev/snd, so the capture device is chosen with NES_ALSA_DEVICE (an ALSA PCM name such as plughw:1,0;
# `arecord -l` on the host lists the cards).
pcm.!default {
    type plug
    slave.pcm {
        @func getenv
        vars [ NES_ALSA_DEVICE ]
        default "plughw:0,0"
    }
}
